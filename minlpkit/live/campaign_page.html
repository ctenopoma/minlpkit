<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>minlpkit campaigns</title>
<style>
  :root {
    --surface:#fcfcfb; --page:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e;
    --muted:#898781; --grid:#e1e0d9;
    --s1:#2a78d6; --good:#0ca30c; --warn:#b98a00; --serious:#ec835a; --critical:#c62828;
    --border:rgba(11,11,11,0.10); --hover:rgba(11,11,11,0.045);
    --selected:rgba(42,120,214,0.09);
    --shadow-head:0 1px 0 rgba(11,11,11,0.05);
    --ease-out:cubic-bezier(0.22, 0.61, 0.36, 1); --dur-fast:110ms;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
         font-size:13px; line-height:1.5; }
  .appbar { height:48px; display:flex; align-items:center; gap:14px; padding:0 16px;
            border-bottom:1px solid var(--border); background:var(--surface);
            box-shadow:var(--shadow-head); }
  .appbar h1 { font-size:14px; font-weight:700; margin:0; }
  .appbar a { color:var(--ink2); font-size:12px; text-decoration:none;
              border-radius:6px; padding:3px 8px; }
  .appbar a:hover { color:var(--s1); background:var(--hover); }
  .appbar .spacer { flex:1; }
  .appbar .hint { color:var(--muted); font-size:11px; }

  .layout { display:flex; min-height:calc(100vh - 48px); }
  aside { width:280px; flex:0 0 auto; border-right:1px solid var(--border);
          background:var(--surface); padding:10px 0; }
  aside .item { padding:8px 14px; cursor:pointer; border-left:3px solid transparent; }
  aside .item:hover { background:var(--hover); }
  aside .item.selected { background:var(--selected); border-left-color:var(--s1); }
  aside .item .cname { font-weight:600; font-size:12.5px; }
  aside .item .cmeta { color:var(--muted); font-size:11px; display:flex; gap:8px; }
  aside .empty { color:var(--muted); padding:14px; font-size:12px; }
  .kind-chip { display:inline-block; font-size:10px; font-weight:700; letter-spacing:0.03em;
    border-radius:999px; padding:0 7px; border:1px solid var(--border); color:var(--ink2); }
  .kind-ablation { color:#8a4b12; background:#faf0e6; }
  .kind-scenario { color:#12508a; background:#e8f1fb; }
  .kind-sweep    { color:#3d6b12; background:#eef7e6; }

  main { flex:1; padding:18px 22px; min-width:0; }
  h2 { font-size:15px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:14px; }

  table.matrix { border-collapse:collapse; width:100%; background:var(--surface);
    border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  table.matrix th, table.matrix td { padding:7px 12px; border-bottom:1px solid var(--border);
    text-align:left; font-size:12.5px; }
  table.matrix th { background:var(--page); color:var(--ink2); font-size:11.5px; }
  table.matrix tr:last-child td { border-bottom:none; }
  table.matrix tr.baseline td { background:rgba(11,11,11,0.025); }
  table.matrix td.num { text-align:right; font-variant-numeric:tabular-nums; }
  table.matrix a { color:var(--s1); text-decoration:none; }
  table.matrix a:hover { text-decoration:underline; }
  .status-badge { display:inline-block; font-size:11px; font-weight:600; border-radius:999px;
    padding:0 8px; border:1px solid var(--border); }
  .st-optimal { color:var(--good); } .st-infeasible { color:var(--critical); }
  .st-timelimit, .st-gaplimit { color:var(--warn); }
  td.gap-cell { position:relative; }
  .gapbar { position:absolute; left:0; top:0; bottom:0; background:rgba(236,131,90,0.18); z-index:0; }
  .gapval { position:relative; z-index:1; }

  .verdicts { margin-top:18px; }
  .verdicts h3 { font-size:13px; margin:0 0 8px; }
  .verdict { display:flex; gap:10px; align-items:flex-start; background:var(--surface);
    border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:8px; }
  .sev { flex:0 0 auto; font-size:10px; font-weight:700; letter-spacing:0.04em;
    border-radius:999px; padding:1px 8px; margin-top:2px; }
  .sev-critical { color:#fff; background:var(--critical); }
  .sev-serious  { color:#fff; background:var(--serious); }
  .sev-warning  { color:#5c4500; background:#f7e9b8; }
  .sev-good     { color:#fff; background:var(--good); }
  .verdict .vbody .vmain { font-weight:600; }
  .verdict .vbody .vev { color:var(--ink2); font-size:12px; }
  .verdict .vbody .vrecipe { color:var(--muted); font-size:11.5px; margin-top:2px; }
  .none { color:var(--muted); font-size:12px; }
</style></head>
<body>
  <div class="appbar">
    <h1>minlpkit campaigns</h1>
    <a href="/">← live monitor</a>
    <span class="spacer"></span>
    <span class="hint">ablation = 制約On/Offの犯人探し / scenario = 入力切替 / sweep = パラメータ</span>
  </div>
  <div class="layout">
    <aside id="clist"><div class="empty">読み込み中…</div></aside>
    <main id="detail"><div class="none">左の一覧から campaign を選択してください</div></main>
  </div>
<script>
let campaigns = [];
let selectedId = null;

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function fmtGap(g) {
  if (g == null) return '—';
  return (g * 100).toFixed(2) + '%';
}
function fmtNum(v) { return v == null ? '—' : Number(v).toLocaleString(); }
function fmtTime(t) { return t == null ? '—' : Number(t).toFixed(1) + 's'; }
function axisLabel(axis) {
  if (!axis) return '—';
  if ('off' in axis) return axis.off === null ? 'baseline(全制約On)' :
    `off: ${axis.off}(-${axis.n_removed ?? '?'}本)`;
  if ('instance' in axis) return `instance: ${axis.instance}`;
  if ('param_set' in axis) return JSON.stringify(axis.param_set);
  return JSON.stringify(axis);
}

function renderList() {
  const el = document.getElementById('clist');
  if (!campaigns.length) {
    el.innerHTML = '<div class="empty">まだ campaign がありません。<br>' +
      'mk.ablate / mk.scenario_sweep / mk.sweep を実行すると<br>ここに一覧されます。</div>';
    return;
  }
  el.innerHTML = campaigns.map(c => `
    <div class="item ${c.campaign_id === selectedId ? 'selected' : ''}" data-id="${esc(c.campaign_id)}">
      <div class="cname">${esc(c.name)} <span class="kind-chip kind-${esc(c.kind)}">${esc(c.kind)}</span></div>
      <div class="cmeta"><span>${esc((c.created || '').replace('T', ' '))}</span>
        <span>${c.members.length} runs</span>
        <span>${c.verdicts.length} 提案</span></div>
    </div>`).join('');
  el.querySelectorAll('.item').forEach(it =>
    it.addEventListener('click', () => { selectedId = it.dataset.id; renderList(); renderDetail(); }));
}

function renderDetail() {
  const el = document.getElementById('detail');
  const c = campaigns.find(x => x.campaign_id === selectedId);
  if (!c) { el.innerHTML = '<div class="none">campaign を選択してください</div>'; return; }
  const gaps = c.members.map(m => m.gap).filter(g => g != null);
  const gmax = Math.max(0.0001, ...gaps);
  const rows = c.members.map(m => {
    const isBase = m.axis && 'off' in m.axis && m.axis.off === null;
    const st = esc(m.status || '—');
    const barW = m.gap != null ? Math.min(100, m.gap / gmax * 100) : 0;
    return `<tr class="${isBase ? 'baseline' : ''}">
      <td>${esc(axisLabel(m.axis))}</td>
      <td><span class="status-badge st-${st}">${st}</span></td>
      <td class="num gap-cell"><span class="gapbar" style="width:${barW}%"></span>
        <span class="gapval">${fmtGap(m.gap)}</span></td>
      <td class="num">${fmtNum(m.nodes)}</td>
      <td class="num">${fmtTime(m.time)}</td>
      <td><a href="/?run=${encodeURIComponent(m.run_id)}" title="live monitorで開く">${esc(m.run_id)}</a></td>
    </tr>`;
  }).join('');
  const verdicts = c.verdicts.length ? c.verdicts.map(v => `
    <div class="verdict">
      <span class="sev sev-${esc(v.severity)}">${esc(v.severity)}</span>
      <div class="vbody">
        <div class="vmain">${esc(v.verdict)}</div>
        <div class="vev">${esc(v.evidence)}</div>
        <div class="vrecipe">直し方: ${esc(v.recipe)}</div>
      </div>
    </div>`).join('')
    : '<div class="none">提案なし(全メンバーが健全、または差分が判定閾値未満)</div>';
  el.innerHTML = `
    <h2>${esc(c.name)} <span class="kind-chip kind-${esc(c.kind)}">${esc(c.kind)}</span></h2>
    <div class="sub">${esc(c.campaign_id)} · ${esc((c.created || '').replace('T', ' '))}</div>
    <table class="matrix">
      <thead><tr><th>軸</th><th>status</th><th>gap</th><th>nodes</th><th>time</th><th>run</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="verdicts"><h3>ライブラリからの提案(verdicts)</h3>${verdicts}</div>`;
}

async function refresh() {
  campaigns = await (await fetch('/api/campaigns')).json();
  if (!selectedId && campaigns.length) selectedId = campaigns[0].campaign_id;
  renderList();
  renderDetail();
}
refresh();
setInterval(refresh, 10000);
</script>
</body></html>
